# PonyAgent CI Pipeline
# Runs on push, PR, and manual dispatch

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'ponyagent/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'Makefile'
      - 'Dockerfile'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run lint
        run: ruff check ponyagent/ tests/

      - name: Run tests with coverage
        run: pytest tests/ --cov=ponyagent --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Docker image
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ponyagent:${{ github.sha }} .

      - name: Test container
        run: |
          docker run --rm ponyagent:${{ github.sha }} python -c "
          from ponyagent import PonyAgent
          agent = PonyAgent()
          print('PonyAgent loaded successfully')
          "
